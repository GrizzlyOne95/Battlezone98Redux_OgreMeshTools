name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Generate canonical app icon
      run: |
        python scripts/generate_app_icon.py branding/repo_icon.svg branding/app_icon.ico --png branding/app_icon.png

    - name: Resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(tr -d '[:space:]' < VERSION)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Generate Windows version metadata
      run: |
        python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller OgreMeshTools.spec --noconfirm

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Battlezone98Redux_OgreMeshTools-windows
        path: dist/BZMeshTools.exe
        if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v')) }}"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve release tag
      id: release_version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="v$(tr -d '[:space:]' < VERSION)"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Package versioned Windows archive
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
      run: |
        set -euo pipefail
        mkdir -p release-packages/windows
        cp release-artifacts/Battlezone98Redux_OgreMeshTools-windows/BZMeshTools.exe release-packages/windows/
        (cd release-packages/windows && zip -q ../Battlezone98Redux_OgreMeshTools-${RELEASE_TAG}-windows.zip BZMeshTools.exe)
        ls -lh release-packages/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_version.outputs.tag }}
        name: ${{ steps.release_version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: release-packages/Battlezone98Redux_OgreMeshTools-v*-windows.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
